<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garage</title>

<style>

*{ box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#203a43;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#111;
}

.select-vhc{
    display: flex;
    color:bisque;
    font-size: xx-large;
    position: fixed;
    top: 120px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

.garage{
    display:flex;
    gap:120px;
}

.vehicle{
    background:white;
    padding:30px;
    border-radius:16px;
    text-align:center;
    width:260px;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.vehicle:hover{
    transform:translateY(-8px);
}

.car{
    position:relative;
    width:180px;
    height:80px;
    margin:auto;
}

.car-body{
    width:180px;
    height:50px;
    background:red;
    border-radius:12px 20px 10px 10px;
    position:absolute;
    bottom:0;
}

.car-top{
    width:90px;
    height:40px;
    background:red;
    position:absolute;
    bottom:40px;
    left:45px;
    border-radius:15px 15px 0 0;
}

.wheel{
    width:36px;
    height:36px;
    background:black;
    border-radius:50%;
    position:absolute;
    bottom:-18px;
}

.wheel.left{ left:20px; }
.wheel.right{ right:20px; }

.bike{
    position:relative;
    width:220px;
    height:120px;
    margin:auto;
}

.bike-body{
    width:140px;
    height:24px;
    background:#0f4c75;
    position:absolute;
    top:60px;
    left:40px;
    border-radius:20px;
}

.bike-seat{
    width:50px;
    height:12px;
    background:#0f4c75;
    position:absolute;
    top:50px;
    left:70px;
    border-radius:8px;
}

.bike-handle{
    width:40px;
    height:8px;
    background:#0f4c75;
    position:absolute;
    top:45px;
    left:140px;
    transform: rotate(25deg);
    border-radius:6px;
}

.bike-wheel{
    width:48px;
    height:48px;
    background:black;
    border-radius:50%;
    position:absolute;
    bottom:0;
}

.bike-wheel.left{ left:30px; }
.bike-wheel.right{ right:30px; }

.select-btn{
    margin-top:20px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.select-btn:hover{
    background:#444;
}

</style>

</head>

<body>

    <div class="select-vhc">
        <div class="choice">Select the Vehicle</div>
    </div>

    <div class="garage">

    <div class="vehicle">
        <div class="car">
            <div class="car-body"></div>
            <div class="car-top"></div>
            <div class="wheel left"></div>
            <div class="wheel right"></div>
        </div>
        
        <h3>Car</h3>
        
        <button class="select-btn" onclick="location.href='car1.html'">
            Select
        </button>
    </div>

    <div class="vehicle">
        <div class="bike">
            <div class="bike-body"></div>
            <div class="bike-seat"></div>
            <div class="bike-handle"></div>
            <div class="bike-wheel left"></div>
            <div class="bike-wheel right"></div>
        </div>
        
        <h3>Bike</h3>
        
        <button class="select-btn" onclick="location.href='bike1.html'">
            Select
        </button>
    </div>

</div>

</body>
</html>
